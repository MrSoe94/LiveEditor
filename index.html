  count++;
  counterVal.textContent = count;
  
  // Highlight effect
  counterVal.style.transform = 'scale(1.2)';
  counterVal.style.color = '#c084fc'; // Purple-400
  setTimeout(() => {
    counterVal.style.transform = 'scale(1)';
    counterVal.style.color = '#ffffff';
  }, 150);

  // Upgrade Badge Level
  if (count >= 30) {
    badge.textContent = "God Mode";
    badge.className = "px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-500/20 text-red-300 border border-red-500/30";
  } else if (count >= 15) {
    badge.textContent = "Pro Clicker";
    badge.className = "px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30";
  } else if (count >= 5) {
    badge.textContent = "Level 2";
    badge.className = "px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-500/20 text-blue-300 border border-blue-500/30";
  }

  // Trigger console log
  console.log(\`[Counter] Clicked! New count is \${count}\`);
});

logBtn.addEventListener('click', () => {

});

// Initialization log

const ctx = canvas.getContext('2d');

let particles = [];
let maxParticles = 120;
let particleTheme = 'indigo-cyan'; // Themes: indigo-cyan, sunset, emerald

// Set canvas dimensions
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Mouse tracking
const mouse = {
  x: null,
  y: null,
  radius: 150
};

window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

window.addEventListener('mouseout', () => {
  mouse.x = null;
  mouse.y = null;
});

class Particle {
  constructor() {
    this.reset();
  }

  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 3 + 1;
    this.speedX = Math.random() * 1.5 - 0.75;
    this.speedY = Math.random() * 1.5 - 0.75;
    
    // Choose color base on theme
    this.color = this.getRandomColor();
  }

  getRandomColor() {
    if (particleTheme === 'sunset') {
      const colors = ['#f43f5e', '#f59e0b', '#ec4899', '#f97316'];
      return colors[Math.floor(Math.random() * colors.length)];
    } else if (particleTheme === 'emerald') {
      const colors = ['#10b981', '#06b6d4', '#34d399', '#a7f3d0'];
      return colors[Math.floor(Math.random() * colors.length)];
    } else {
      // indigo-cyan
      const colors = ['#6366f1', '#06b6d4', '#3b82f6', '#818cf8'];
      return colors[Math.floor(Math.random() * colors.length)];
    }
  }

  update() {
    this.x += this.speedX;
    this.y += this.speedY;

    // Boundary check
    if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
    if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

    // Interactivity: pull to mouse
    if (mouse.x !== null && mouse.y !== null) {
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      let distance = Math.sqrt(dx * dx + dy * dy);
      if (distance < mouse.radius) {
        const force = (mouse.radius - distance) / mouse.radius;
        this.x += (dx / distance) * force * 2;
        this.y += (dy / distance) * force * 2;
      }
    }
  }

  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Populate particles
function init() {
  particles = [];
  for (let i = 0; i < maxParticles; i++) {
    particles.push(new Particle());
  }
  console.log(\`Initialized \${maxParticles} particles with theme: \${particleTheme}\`);
}
init();

// Draw connecting lines
function drawLines() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      let dx = particles[i].x - particles[j].x;
      let dy = particles[i].y - particles[j].y;
      let distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 100) {
        // Opacity based on distance
        let opacity = (100 - distance) / 100 * 0.15;
        ctx.strokeStyle = particleTheme === 'sunset' ? \`rgba(244, 63, 94, \${opacity})\` : 
                          particleTheme === 'emerald' ? \`rgba(16, 185, 129, \${opacity})\` : 
                          \`rgba(99, 102, 241, \${opacity})\`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
}

// Animation loop
function animate() {
  ctx.fillStyle = 'rgba(13, 17, 23, 0.2)'; // trail effect
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let p of particles) {
    p.update();
    p.draw();
  }
  drawLines();

  requestAnimationFrame(animate);
}
animate();

// Hook up buttons
document.getElementById('btn-color').addEventListener('click', () => {
  const themes = ['indigo-cyan', 'sunset', 'emerald'];
  const nextIdx = (themes.indexOf(particleTheme) + 1) % themes.length;
  particleTheme = themes[nextIdx];
  
  // Re-color all particles
  particles.forEach(p => p.color = p.getRandomColor());
  console.log("Switched particle theme to " + particleTheme);
});

document.getElementById('btn-count').addEventListener('click', () => {
  maxParticles = maxParticles === 120 ? 240 : 120;
  init();
  document.getElementById('btn-count').textContent = maxParticles === 120 ? 'Double Particles' : 'Reduce Particles';
});`},{id:"3d-cube",name:"Interactive 3D Transform Cube",description:"A gorgeous 3D cube rendered purely in CSS 3D transforms, rotatable by dragging the mouse.",includeTailwind:!1,html:`<div class="scene">

let rotateX = -30;
let rotateY = 45;
let autoSpinSpeed = 2; // Speed factor

let isDragging = false;
let startX = 0;
let startY = 0;

// Mouse events on window to allow rotating from anywhere
window.addEventListener('mousedown', (e) => {
  // Ignore slider drag
  if (e.target.tagName === 'INPUT' || e.target.closest('.controls-panel')) return;
  isDragging = true;
  startX = e.clientX;
  startY = e.clientY;
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  
  const deltaX = e.clientX - startX;
  const deltaY = e.clientY - startY;
  
  rotateY += deltaX * 0.5;
  rotateX -= deltaY * 0.5;
  
  // Apply rotation
  cube.style.transform = \`rotateX(\${rotateX}deg) rotateY(\${rotateY}deg)\`;
  
  startX = e.clientX;
  startY = e.clientY;
});

window.addEventListener('mouseup', () => {
  isDragging = false;
});

// Touch controls for mobile
window.addEventListener('touchstart', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.closest('.controls-panel')) return;
  isDragging = true;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});

window.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  
  const deltaX = e.touches[0].clientX - startX;
  const deltaY = e.touches[0].clientY - startY;
  
  rotateY += deltaX * 0.5;
  rotateX -= deltaY * 0.5;
  
  cube.style.transform = \`rotateX(\${rotateX}deg) rotateY(\${rotateY}deg)\`;
  
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});

window.addEventListener('touchend', () => {
  isDragging = false;
});

// Opacity changer
inpOpacity.addEventListener('input', (e) => {
  const op = e.target.value;
  valOpacity.textContent = op;
  
  const faces = document.querySelectorAll('.face');
  faces.forEach(face => {
    // Get existing background-color rgba and adjust opacity
    const bg = window.getComputedStyle(face).backgroundColor;
    // bg is "rgba(r, g, b, a)" or "rgb(r, g, b)"
    const match = bg.match(/rgba?\\((\\d+),\\s*(\\d+),\\s*(\\d+)(?:,\\s*([\\d.]+))?\\)/);
    if (match) {
      const r = match[1];
      const g = match[2];
      const b = match[3];
      face.style.backgroundColor = \`rgba(\${r}, \${g}, \${b}, \${op})\`;
    }
  });
});

// Speed control
inpSpeed.addEventListener('input', (e) => {
  autoSpinSpeed = Number(e.target.value);
  const labels = {
    0: 'Static',
    1: 'Snail',
    2: 'Normal',
    4: 'Fast',
    7: 'Super Fast',
    10: 'Ludicrous'
  };
  valSpeed.textContent = labels[autoSpinSpeed] || (autoSpinSpeed > 7 ? 'Insane' : 'Medium');
});

// Auto-spin logic when NOT dragging
function spin() {
  if (!isDragging && autoSpinSpeed > 0) {
    rotateY += autoSpinSpeed * 0.15;
    cube.style.transform = \`rotateX(\${rotateX}deg) rotateY(\${rotateY}deg)\`;
  }
  requestAnimationFrame(spin);
}
spin();

const fetchBtn = document.getElementById('fetch-btn');
const apiOutput = document.getElementById('api-output');

// Request ini diproses NYATA oleh server.js (routing + database di server runtime)
fetchBtn.addEventListener('click', async () => {
  apiOutput.classList.remove('hidden');
  apiOutput.textContent = 'GET /api/users ...';

  try {
    const response = await fetch('/api/users');
    const data = await response.json();

    apiOutput.textContent = JSON.stringify(data, null, 2);
    console.log('Server response:', data);
  } catch (err) {
    apiOutput.textContent = 'Error: ' + err.message;
    console.error('Fetch error:', err);
  }
});

// Contoh POST nyata ke server
const postBtn = document.getElementById('post-btn');
if (postBtn) {
  postBtn.addEventListener('click', async () => {
    apiOutput.classList.remove('hidden');
    const response = await fetch('/api/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'New User ' + Date.now(), role: 'Member' }),
    });
    const data = await response.json();
    apiOutput.textContent = JSON.stringify(data, null, 2);
    console.log('Created via server:', data);
  });
}`},{id:"api-folder",name:"api",type:"folder",parentId:"root"},{id:"users-json",name:"users.json",type:"file",parentId:"api-folder",content:`{

Welcome to your multi-file application workspace.

## Features
- **Virtual File Explorer**: Create nested HTML, CSS, JavaScript, TypeScript, JSON and other files.
- **Live Preview**: Local HTML, stylesheets, scripts and assets are resolved from the project files.
- **Real Server Runtime**: Run the TypeScript API with node server.ts and call endpoints with curl /api/users.
- **TypeScript Example**: Run node scripts/hello.ts; math.ts is compiled and loaded as a relative module.
- **Real npm metadata**: Use npm install <package> in the terminal. Runtime packages are loaded from esm.sh.
- **Auto Entry Detection**: WebPen finds the script to run by itself, even with unusual names such as backend/launcher.mjs. It reads file names, folders, code signals (app.listen, createServer, routes) and package.json scripts.start. Run entries in the terminal to see the result, or pick another file from the Entry chip in the Live Preview header.
- **Multi-Page Applications**: Open login, admin and nested pages without leaving the preview. Every page gets its local CSS/JS, relative links and form handling. The preview address bar provides back, forward, home and reload controls.
- **PHP Applications**: Web pages run through the real PHP CGI SAPI. Session cookies, session_start(), header('Location: ...'), GET/POST forms and logout continue across pages. Standalone PHP scripts can still be run in the terminal.
- **Preview Sessions**: Login cookies are kept inside this project preview while it is open. A separate imported project starts with a fresh cookie jar. External databases and third-party login providers still need their own working configuration.

// API mirip Express: app.get / app.post / app.put / app.patch / app.delete
const webpen = require('webpen');
const app = webpen.createServer();

// ---- Database in-memory (persisten antar request) ----
const db = webpen.getDb();
db.users = db.users || [
  { id: 1, name: 'Budi Santoso', role: 'Fullstack Developer', active: true },
  { id: 2, name: 'Siti Aminah', role: 'UI/UX Designer', active: true },
  { id: 3, name: 'Dewi Lestari', role: 'Project Manager', active: false },
];

// ---- Health check ----
app.get('/api/health', (req, res) => {
  res.json({ status: 'ok', uptime: Date.now(), routes: 'live' });
});

// ---- CRUD Users ----
app.get('/api/users', (req, res) => {
  const active = req.query.active;
  let users = db.users;
  if (active === 'true') users = users.filter((u) => u.active);
  if (active === 'false') users = users.filter((u) => !u.active);
  res.json({ status: 'success', count: users.length, users });
});

app.get('/api/users/:id', (req, res) => {
  const user = db.users.find((u) => String(u.id) === String(req.params.id));
  if (!user) return res.status(404).json({ error: 'User not found' });
  res.json(user);
});

app.post('/api/users', (req, res) => {
  const body = req.body || {};
  if (!body.name) return res.status(400).json({ error: 'name is required' });
  const nextId = db.users.reduce((max, u) => Math.max(max, Number(u.id) || 0), 0) + 1;
  const user = { id: nextId, name: body.name, role: body.role || 'Member', active: body.active !== false };
  db.users.push(user);
  res.status(201).json({ status: 'created', user });
});

app.put('/api/users/:id', (req, res) => {
  const idx = db.users.findIndex((u) => String(u.id) === String(req.params.id));
  if (idx === -1) return res.status(404).json({ error: 'User not found' });
  db.users[idx] = Object.assign({}, db.users[idx], req.body || {});
  res.json({ status: 'updated', user: db.users[idx] });
});

app.delete('/api/users/:id', (req, res) => {
  const before = db.users.length;
  db.users = db.users.filter((u) => String(u.id) !== String(req.params.id));
  if (db.users.length === before) return res.status(404).json({ error: 'User not found' });
  res.json({ status: 'deleted', remaining: db.users.length });
});

// ---- Static file serving (index.html, css, js, gambar) ----
app.use(webpen.static('/'));

app.listen(3000, () => {
  console.log('Server berjalan nyata di http://localhost:3000');
});

module.exports = app;
